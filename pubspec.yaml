name: snownlp
description: A Simplified Chinese NLP library for Dart — segmentation, POS tagging, sentiment (Naive Bayes), BM25 similarity, TextRank summary/keywords, traditional→simplified conversion, and pinyin. Port of snownlp.
version: 1.2.0
repository: https://github.com/NaivG/snownlp
homepage: https://github.com/NaivG/snownlp
issue_tracker: https://github.com/NaivG/snownlp/issues

environment:
  sdk: ^3.11.0

dependencies:
  path: ^1.9.0 # for loading model files
  flutter:
    sdk: flutter # enables Flutter asset bundling for lib/src/data/

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

flutter:
  assets:
    - lib/src/data/
